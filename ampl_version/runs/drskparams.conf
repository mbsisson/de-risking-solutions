solver gurobi #/Applications/knitro-16.0.0-ARM-MacOS/bin/knitroampl  #gurobi
theta auto
lam_hi 10.0
lam_lo 9.0
xi 10.0
budget 0.01
phi_scale percent_violation  #scaled_abs_violation
alpha 10.0
decimal_risk_thresh 3  ###how many decimal places coeff.s need to be considered risky
ncuts_add 5  ###how many cuts to add per iteration
cut_phiThresh 0.5  ###Cuts whose corresponding phi max is below this percent of maxPhi are deemed insigif.
cut_method quasi-greedy  #greedy
maxcuts 100  ###max number of cuts to use
tol 1e-4
maxits 10
PhiReduc 0.1  ###amount to reduce Phi_max by for early termination
zerothresh 1e-8
solve_time_limit 45
solve_soln_limit 10
loud 1
verbose 1
breakpoints 0
END