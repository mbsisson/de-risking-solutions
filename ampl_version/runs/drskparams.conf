solver /Applications/knitro-16.0.0-ARM-MacOS/bin/knitroampl  #gurobi
theta auto #100.0
lam_hi 10.0
lam_lo 09.0
xi 1.0
budget 0.01
phi_scale percent_violation  #scaled_abs_violation
alpha 1.0
decimal_risk_thresh 3  #how many decimal places coeff.s need to be considered risky
tol 1e-4
maxits 10
PhiReduc 0.1  #amount to reduce Phi_max by for early termination
zerothresh 1e-8
solve_time_limit 45
loud 1
verbose 0
breakpoints 0
END